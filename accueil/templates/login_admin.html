{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion - INOV Learn</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0087C2 0%, #005a8e 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        background: white;
        border-radius: 20px;
        padding: 40px 36px;
        width: 400px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-logo {
        text-align: center;
        margin-bottom: 28px;
    }
    .login-logo img {
        height: 70px;
        object-fit: contain;
    }
    .login-logo h1 {
        font-size: 22px;
        font-weight: 800;
        color: #0087C2;
        margin-top: 8px;
        letter-spacing: 1px;
    }
    .login-logo p {
        font-size: 12px;
        color: #888;
        margin-top: 3px;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        font-size: 11px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: block;
        margin-bottom: 6px;
    }
    .input-wrap {
        display: flex;
        align-items: center;
        border: 1.5px solid #E5E7EB;
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .input-wrap:focus-within {
        border-color: #0087C2;
    }
    .input-wrap i {
        padding: 0 14px;
        color: #9CA3AF;
        font-size: 14px;
    }
    .input-wrap input {
        flex: 1;
        padding: 12px 12px 12px 0;
        border: none;
        outline: none;
        font-size: 13px;
        color: #1F2937;
        font-family: Arial;
    }
    .input-wrap input::placeholder { color: #9CA3AF; }

    .msg-error {
        background: #FEE2E2;
        color: #991B1B;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-login {
        width: 100%;
        padding: 13px;
        background: #0087C2;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s;
        letter-spacing: 0.5px;
    }
    .btn-login:hover { background: #006FA3; }

    .login-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 11px;
        color: #aaa;
    }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <img src="{% static 'images/inov learn.png' %}" alt="INOV Learn"
             onerror="this.style.display='none'">
        <h1>INOV LEARN</h1>
        <p>Espace Administrateur</p>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="msg-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Adresse email</label>
            <div class="input-wrap">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="admin@inovlearn.cm" required/>
            </div>
        </div>

        <div class="form-group">
            <label>Mot de passe</label>
            <div class="input-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="••••••••" required/>
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> &nbsp;Se connecter
        </button>
    </form>

    <div class="login-footer">
        Centre de Formation INOV Learn — Douala, Cameroun
    </div>
</div>

</body>
</html>
