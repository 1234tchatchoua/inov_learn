{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Mon Espace - INOV Learn</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #F3F4F6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }

        .logo { margin-bottom: 24px; }
        .logo img { width: 100px; }

        .bienvenue {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #0087C2;
            margin-bottom: 8px;
        }

        .filiere {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 32px;
        }

        .badge {
            display: inline-block;
            background: #E0F4FF;
            color: #0087C2;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 36px;
        }

        .btn-deconnexion {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 28px;
            background: #FEE2E2;
            color: #EF4444;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-deconnexion:hover {
            background: #EF4444;
            color: white;
        }
    </style>
</head>
<body>


</body>
</html>
